name: Web-Container

on:
  push:
    branches: [main, web-container]
    paths:
      - "core/**"
      - "app/src/fonts.rs"
      - "app/src/ocr.rs"
      - "app/src/pipeline.rs"
      - "tools/zmn-web/**"
      - "tools/zmn-pruefstand/**"
      - "packaging/web/**"
      - "packaging/linux/**"
      - "tools/schriften/**"
      - ".github/workflows/web-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/web/Dockerfile
          push: true
          tags: |
            ghcr.io/mitkiprogrammieren/zeichnemichnach-web:latest
            ghcr.io/mitkiprogrammieren/zeichnemichnach-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MitKIprogrammieren/zeichnemichnach
            org.opencontainers.image.description=ZeichneMichNach im Browser
          cache-from: type=gha
          cache-to: type=gha,mode=max
