name: Skizze-Container

on:
  push:
    branches: [main, skizze-zeichnung]
    paths:
      - "skizze/**"
      - ".github/workflows/skizze-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: skizze
          push: true
          tags: |
            ghcr.io/mitkiprogrammieren/skizze-zeichnung:latest
            ghcr.io/mitkiprogrammieren/skizze-zeichnung:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/MitKIprogrammieren/zeichnemichnach
            org.opencontainers.image.description=Skizze → Zeichnung: Handskizze per Gemini zur Fertigungszeichnung
