[package]
name = "zeichnemichnach-app"
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace]

[[bin]]
name = "ZeichneMichNach"
path = "src/main.rs"

[dependencies]
nz-core = { path = "../core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ttf-parser = "0.25"

[features]
# nur für Testläufe unter Linux (Bildschirmfotos im Xvfb)
x11 = ["eframe/x11"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
